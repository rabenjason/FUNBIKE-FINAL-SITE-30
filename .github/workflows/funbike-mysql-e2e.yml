name: FunBike MySQL E2E

on:
  pull_request:
    paths:
      - "server/**"
      - "dashboard/**"
      - "src/**"
      - ".github/workflows/funbike-mysql-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "dashboard/**"
      - "src/**"
      - ".github/workflows/funbike-mysql-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-e2e:
    name: Parcours MySQL complet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          # Base et identifiants éphémères, propres à ce job de test uniquement.
          MYSQL_ROOT_PASSWORD: funbike-ci-root
          MYSQL_DATABASE: funbike_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfunbike-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: funbike-ci-root
      DB_NAME: funbike_test
      JWT_SECRET: funbike-ci-jwt-secret-for-tests-only-32chars
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Installer le backend
        run: npm ci --prefix server

      - name: Créer les tables MySQL
        run: npm --prefix server run db:migrate

      - name: Importer les 60 produits
        run: npm --prefix server run db:seed

      - name: Tester le parcours complet
        run: npm --prefix server run test:mysql-e2e
